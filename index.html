<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Évraune - Kokunuz, imzanız. Zamansız ve seçkin parfümler.">
  <title>Évraune | Kokunuz, İmzanız</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #090909;
      color: #f5f1e8;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 76px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      background: rgba(9, 9, 9, 0.9);
      border-bottom: 1px solid rgba(201, 164, 92, 0.2);
      backdrop-filter: blur(12px);
    }

    .logo {
      color: #d4af6a;
      font-size: 28px;
      letter-spacing: 6px;
      font-weight: normal;
    }

    nav {
      display: flex;
      gap: 35px;
    }

    nav a {
      color: #ddd5c5;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: 0.3s;
    }

    nav a:hover {
      color: #d4af6a;
    }

    .cart-btn {
      border: 1px solid #c9a45c;
      background: transparent;
      color: #d4af6a;
      padding: 10px 17px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .cart-btn:hover {
      background: #c9a45c;
      color: #090909;
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      padding: 130px 7% 70px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 50px;
      background:
        radial-gradient(circle at 75% 45%, rgba(181, 140, 64, 0.12), transparent 35%),
        #090909;
    }

    .hero-text {
      max-width: 650px;
    }

    .small-title {
      color: #c9a45c;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: clamp(55px, 8vw, 105px);
      line-height: 0.95;
      font-weight: normal;
      letter-spacing: 3px;
    }

    .hero h1 span {
      color: #c9a45c;
      font-style: italic;
    }

    .hero p {
      margin-top: 30px;
      max-width: 500px;
      color: #aaa398;
      font-family: Arial, sans-serif;
      line-height: 1.8;
      font-size: 15px;
    }

    .hero-buttons {
      display: flex;
      gap: 15px;
      margin-top: 35px;
      flex-wrap: wrap;
    }

    .gold-btn {
      background: #c9a45c;
      color: #090909;
      padding: 15px 30px;
      border: 1px solid #c9a45c;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: 0.3s;
    }

    .gold-btn:hover {
      background: transparent;
      color: #c9a45c;
    }

    .outline-btn {
      background: transparent;
      color: #ddd5c5;
      padding: 15px 30px;
      border: 1px solid #555;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: 0.3s;
    }

    .outline-btn:hover {
      border-color: #c9a45c;
      color: #c9a45c;
    }

    /* BOTTLE */
    .bottle-area {
      min-height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 360px;
      height: 360px;
      background: rgba(201, 164, 92, 0.12);
      filter: blur(80px);
      border-radius: 50%;
    }

    .bottle {
      width: 220px;
      height: 330px;
      position: relative;
      z-index: 2;
      border-radius: 12px 12px 28px 28px;
      border: 1px solid rgba(212, 175, 106, 0.7);
      background:
        linear-gradient(120deg, rgba(255,255,255,0.16), transparent 25%),
        linear-gradient(135deg, #252018, #0c0b09 60%, #342919);
      box-shadow:
        0 35px 80px rgba(0,0,0,0.8),
        inset 0 0 35px rgba(201,164,92,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bottle::before {
      content: "";
      position: absolute;
      top: -58px;
      width: 95px;
      height: 60px;
      border: 1px solid #b99552;
      border-bottom: none;
      background: linear-gradient(90deg, #191613, #5b482b, #191613);
    }

    .bottle-label {
      width: 150px;
      padding: 28px 10px;
      text-align: center;
      border: 1px solid #b99552;
      background: rgba(9, 9, 9, 0.85);
    }

    .bottle-label strong {
      display: block;
      color: #d4af6a;
      font-size: 19px;
      letter-spacing: 4px;
      font-weight: normal;
    }

    .bottle-label small {
      display: block;
      margin-top: 12px;
      color: #c9c0af;
      font-family: Arial, sans-serif;
      font-size: 8px;
      letter-spacing: 2px;
    }

    /* SECTION */
    section {
      padding: 100px 7%;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 60px;
    }

    .section-heading .small-title {
      margin-bottom: 15px;
    }
