  <title>Évraune — Your Scent, Your Signature</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link

    rel="stylesheet"

  <style>
    :root {
      --bg: #090909;
      --bg-soft: #111111;
      --card: #161616;
      --line: rgba(255, 255, 255, 0.12);
      --text: #f4f0e9;
      --muted: #aaa49b;
      --gold: #c9a875;
      --gold-light: #e4cda2;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .serif {
      font-family: "Playfair Display", serif;
    }

    /* NAVBAR */

    .navbar {
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 82px;
      display: flex;
      align-items: center;
      background: linear-gradient(
        to bottom,
        rgba(9, 9, 9, 0.95),
        rgba(9, 9, 9, 0)
      );
    }

    .nav-inner {
      width: min(1280px, calc(100% - 48px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 28px;
      letter-spacing: 1px;
      font-weight: 500;
    }

    .logo span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      gap: 34px;
      align-items: center;
      font-size: 12px;
      color: #d4d0c8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nav-links a {
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--gold-light);
    }

    .nav-button {
      border: 1px solid var(--line);
      padding: 12px 18px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: 0.3s ease;
    }

    .nav-button:hover {
      background: var(--text);
      color: #111;
    }
